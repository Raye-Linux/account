[package]
name = "raye-accountd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raye account on the desktop: sign-in through the browser, settings sync, profile"

[dependencies]
raye-account-common = { path = "../../common" }
tokio = { workspace = true, features = ["rt"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
ed25519-dalek.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
rand.workspace = true
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
# Keeps tokens in a plain file named by RAYE_ACCOUNT_TEST_KEYRING_FILE, for
# the headless demo and tests where no keyring runs. Never in a package.
insecure-test-keyring = []
