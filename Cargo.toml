[workspace]
resolver = "2"
members = ["common", "server", "client/daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "process", "fs", "io-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
